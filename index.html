<!doctype html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kemija Kviz</title>
  <style>
    :root {
      --bg: #f3f7ff;
      --card: #ffffff;
      --text: #101a2a;
      --muted: #5f6b7a;
      --primary: #2a6bf2;
      --ok: #168f4b;
      --bad: #c63b3b;
      --border: #d7deea;
      --shadow: 0 8px 22px rgba(20, 48, 96, 0.08);
      --bg-accent: radial-gradient(1200px 500px at -10% -20%, #dcebff 0%, transparent 60%),
                   radial-gradient(900px 400px at 110% -20%, #e5ddff 0%, transparent 55%);
    }

    [data-theme="dark"] {
      --bg: #0f1523;
      --card: #171f32;
      --text: #e7eeff;
      --muted: #a4b2ce;
      --primary: #67a1ff;
      --ok: #37bb74;
      --bad: #ff7373;
      --border: #2a3755;
      --shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
      --bg-accent: radial-gradient(1100px 500px at -10% -20%, #1e2f53 0%, transparent 65%),
                   radial-gradient(900px 400px at 110% -20%, #2a2149 0%, transparent 60%);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--bg);
      background-image: var(--bg-accent);
      color: var(--text);
      line-height: 1.45;
    }

    .app {
      max-width: 880px;
      margin: 0 auto;
      padding: 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      box-shadow: var(--shadow);
      margin-bottom: 14px;
    }

    h1, h2 { margin: 0 0 10px; }
    p { margin: 8px 0; }

    .muted { color: var(--muted); }

    .row {
      display: grid;
      gap: 12px;
      grid-template-columns: 1fr;
      margin: 10px 0;
    }

    @media (min-width: 700px) {
      .row.two { grid-template-columns: 1fr 1fr; }
      .row.three { grid-template-columns: 1fr 1fr 1fr; }
    }

    label { font-weight: 650; display: block; margin-bottom: 4px; }

    input[type="text"], input[type="number"], select {
      width: 100%;
      min-height: 46px;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 1rem;
      background: var(--card);
      color: var(--text);
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      min-height: 48px;
    }

    .btn-primary { background: var(--primary); color: white; }
    .btn-secondary { background: color-mix(in oklab, var(--primary) 18%, var(--card)); color: var(--text); }
    .btn-ghost { background: color-mix(in oklab, var(--card) 75%, var(--text)); color: var(--text); }

    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .badge {
      border-radius: 999px;
      background: color-mix(in oklab, var(--primary) 20%, var(--card));
      color: var(--text);
      padding: 8px 12px;
      font-weight: 700;
      font-size: 0.92rem;
    }

    .feedback {
      border-radius: 10px;
      padding: 12px;
      margin-top: 14px;
      border: 1px solid transparent;
    }

    .feedback.ok {
      background: #e8f8ef;
      border-color: #bbebcf;
      color: #155f36;
    }

    .feedback.bad {
      background: #fff1f1;
      border-color: #ffd0d0;
      color: #7f1f1f;
    }

    .hidden { display: none !important; }

    .status-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      text-align: center;
    }

    .status-grid strong {
      display: block;
      font-size: 1.2rem;
    }

    .eq-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 10px;
    }

    .coef {
      width: 2.6em;
      min-height: 44px;
      text-align: center;
      font-weight: 700;
    }

    .chip {
      background: color-mix(in oklab, var(--primary) 12%, var(--card));
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .task-group {
      border: 1px dashed var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-top: 8px;
      background: color-mix(in oklab, var(--primary) 6%, var(--card));
    }

    .dial-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: flex-start;
    }

    .dial-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      min-width: 92px;
    }

    .dial-label {
      font-size: 0.82rem;
      text-align: center;
      color: var(--muted);
      font-weight: 700;
      min-height: 2.2em;
    }

    .dial {
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px;
      background: color-mix(in oklab, var(--primary) 8%, var(--card));
    }

    .dial-btn {
      min-width: 42px;
      min-height: 42px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 1.2rem;
      font-weight: 900;
      line-height: 1;
      padding: 0;
    }

    .dial-value {
      min-width: 52px;
      min-height: 52px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 2px solid color-mix(in oklab, var(--primary) 55%, var(--border));
      background: var(--card);
      font-size: 1.3rem;
      font-weight: 900;
    }

    .formula-preview {
      margin-top: 8px;
      font-size: 1.15rem;
      font-weight: 800;
      text-align: center;
    }

    .option-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-top: 8px;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      border-radius: 12px;
      padding: 10px 12px;
      font-weight: 700;
    }

    .option-btn.selected {
      border-color: var(--primary);
      background: color-mix(in oklab, var(--primary) 22%, var(--card));
      box-shadow: 0 0 0 2px color-mix(in oklab, var(--primary) 28%, transparent);
    }

    .segment-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .segment-btn {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      border-radius: 999px;
      padding: 10px 14px;
      font-weight: 800;
      min-width: 56px;
      text-align: center;
    }

    .segment-btn.selected {
      border-color: var(--primary);
      background: color-mix(in oklab, var(--primary) 25%, var(--card));
    }

    .class-item {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      margin-top: 10px;
      background: var(--card);
    }

    .small { font-size: 0.9rem; }

    @media (max-width: 699px) {
      .card { padding: 14px; border-radius: 12px; }
      h1 { font-size: 1.4rem; }
      h2 { font-size: 1.2rem; }
      .status-grid { grid-template-columns: 1fr; }
      .eq-row { align-items: stretch; }
      .coef { width: 2.6em; }
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0f1523;
        --card: #171f32;
        --text: #e7eeff;
        --muted: #a4b2ce;
        --primary: #67a1ff;
        --ok: #37bb74;
        --bad: #ff7373;
        --border: #2a3755;
        --shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
        --bg-accent: radial-gradient(1100px 500px at -10% -20%, #1e2f53 0%, transparent 65%),
                     radial-gradient(900px 400px at 110% -20%, #2a2149 0%, transparent 60%);
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="card topbar">
      <h1>Kemija Kviz</h1>
      <div class="topbar">
        <div class="badge" id="bestScoreBadge">Najbolji rezultat: 0</div>
        <button class="btn-ghost" id="themeToggleBtn" aria-label="Promijeni temu">🌙 Tamni način</button>
      </div>
    </section>

    <section class="card" id="setupScreen">
      <h2>Postavke kviza</h2>
      <p class="muted">Odaberi kategoriju i težinu pa klikni na "Pokreni kviz".</p>

      <div class="row two">
        <div>
          <label for="categorySelect">Kategorija</label>
          <select id="categorySelect"></select>
        </div>
        <div>
          <label for="difficultySelect">Težina</label>
          <select id="difficultySelect">
            <option value="all">Sve</option>
            <option value="lako">Lako</option>
            <option value="srednje">Srednje</option>
            <option value="teško">Teško</option>
          </select>
        </div>
      </div>

      <button class="btn-primary" id="startBtn">Pokreni kviz</button>
    </section>

    <section class="card hidden" id="quizScreen">
      <div class="topbar">
        <div class="badge" id="progressBadge">Pitanje 1/10</div>
        <div class="badge" id="scoreBadge">Točno: 0 | Netočno: 0</div>
      </div>

      <h2 id="questionTitle" style="margin-top:12px;"></h2>
      <p class="muted" id="questionMeta"></p>

      <div id="answerContainer"></div>

      <div id="feedback" class="feedback hidden"></div>

      <div class="row two" style="margin-top: 14px;">
        <button class="btn-primary" id="checkBtn">Provjeri</button>
        <button class="btn-secondary hidden" id="nextBtn">Sljedeće pitanje</button>
      </div>
    </section>

    <section class="card hidden" id="resultScreen">
      <h2>Rezultat kviza</h2>
      <div class="status-grid">
        <div class="task-group"><span>Točno</span><strong id="resultCorrect">0</strong></div>
        <div class="task-group"><span>Netočno</span><strong id="resultWrong">0</strong></div>
        <div class="task-group"><span>Postotak</span><strong id="resultPercent">0%</strong></div>
      </div>
      <p class="muted" id="resultNote"></p>
      <button class="btn-ghost" id="restartBtn">Ponovno pokreni kviz</button>
    </section>
  </main>

    function parseItemsFromQuestion(questionText) {
      const cleaned = String(questionText || "").replace(/.*?:\s*/, "").replace(/\.$/, "");
      return cleaned.split(",").map(s => s.trim()).filter(Boolean);
    }

    function adaptAnswerByType(taskType, answer) {
      if (!answer) return {};
      if (taskType === "equation_balance") return { coefficients: answer.koeficijenti || [] };
      if (taskType === "compound_formula") return { formula: answer.formula || "" };
      if (taskType === "compound_name_valency") return { name: answer.naziv || "", valencies: answer.valencije || {} };
      if (taskType === "subatomic_counts") return { protons: answer.protoni, electrons: answer.elektroni, neutrons: answer.neutroni };
      if (taskType === "classification") return {
        atomi_elementa: answer.atomi_elementa || [],
        molekule_elementarnih_tvari: answer.molekule_elementarnih_tvari || [],
        molekule_spojeva: answer.molekule_spojeva || []
      };
      if (taskType === "formula_notation") return { notation: answer.zapis || "" };
      return answer;
    }

      const payload = {};

        payload.sides = raw.provjeraOdgovora?.metapodaci?.sides || [];
      }

      if (taskType === "classification") {
        payload.items = raw.provjeraOdgovora?.metapodaci?.stavke || parseItemsFromQuestion(raw.pitanje);
        payload.groups = ["atomi_elementa", "molekule_elementarnih_tvari", "molekule_spojeva"];
      }

      return {
        id: raw.id,
        category: CATEGORY_LABELS[raw.kategorija] || raw.kategorija,

    function normalizeFormulaInput(text) {
      if (!text) return "";
      const map = { "₀":"0","₁":"1","₂":"2","₃":"3","₄":"4","₅":"5","₆":"6","₇":"7","₈":"8","₉":"9" };
      return String(text)
        .trim()
        .replace(/[₀₁₂₃₄₅₆₇₈₉]/g, char => map[char] || char)
        .replace(/\s+/g, "")
        .toLowerCase();
    }

    function formulaToSubscript(text) {
      if (!text) return "";
      const map = { "0":"₀","1":"₁","2":"₂","3":"₃","4":"₄","5":"₅","6":"₆","7":"₇","8":"₈","9":"₉" };
      const str = String(text);
      let out = "";
      for (let i = 0; i < str.length; i++) {
        const ch = str[i];
        const prev = i > 0 ? str[i - 1] : "";
        const prevOut = out.length ? out[out.length - 1] : "";
        const isDigit = /[0-9]/.test(ch);
        const shouldSubscript = isDigit && (/[A-Za-z\)]/.test(prev) || /[₀₁₂₃₄₅₆₇₈₉]/.test(prevOut));
        out += shouldSubscript ? (map[ch] || ch) : ch;
      }
      return out;
    }

    function normalizeName(text) {
      return String(text || "")
        .trim()
        .toLowerCase()
        .replace(/č|ć/g, "c")
        .replace(/ž/g, "z")
        .replace(/š/g, "s")
        .replace(/đ/g, "d")
        .replace(/\s+/g, " ");
    }

    function parseChemicalFormula(formula) {
      const parts = [];
      const re = /([A-Z][a-z]?)(\d*)/g;
      const src = String(formula || "");
      let m;
      while ((m = re.exec(src))) {
        parts.push({ symbol: m[1], count: m[2] ? Number(m[2]) : 1 });
      }
      return parts;
    }

    function createNumberDial(options) {
      const {
        id,
        value = 0,
        min = 0,
        max = 9,
        label = "Brojčanik"
      } = options || {};
      const wrap = document.createElement("div");
      wrap.className = "dial-wrap";

      const labelEl = document.createElement("div");
      labelEl.className = "dial-label";
      labelEl.textContent = label;

      const dial = document.createElement("div");
      dial.className = "dial";
      dial.dataset.dialId = id;
      dial.dataset.min = String(min);
      dial.dataset.max = String(max);
      dial.setAttribute("role", "spinbutton");
      dial.setAttribute("aria-label", label);
      dial.setAttribute("aria-valuemin", String(min));
      dial.setAttribute("aria-valuemax", String(max));

      const minus = document.createElement("button");
      minus.type = "button";
      minus.className = "dial-btn";
      minus.textContent = "−";
      minus.setAttribute("aria-label", `Smanji: ${label}`);

      const val = document.createElement("div");
      val.className = "dial-value";
      val.setAttribute("aria-live", "polite");

      const plus = document.createElement("button");
      plus.type = "button";
      plus.className = "dial-btn";
      plus.textContent = "+";
      plus.setAttribute("aria-label", `Povećaj: ${label}`);

      function setValue(next) {
        const safe = Math.max(min, Math.min(max, Number.isFinite(next) ? Math.trunc(next) : min));
        dial.dataset.value = String(safe);
        dial.setAttribute("aria-valuenow", String(safe));
        val.textContent = String(safe);
        dial.dispatchEvent(new CustomEvent("dialchange", { bubbles: true, detail: { id, value: safe } }));
      }

      minus.addEventListener("click", () => setValue(Number(dial.dataset.value || value) - 1));
      plus.addEventListener("click", () => setValue(Number(dial.dataset.value || value) + 1));
      setValue(value);

      dial.append(minus, val, plus);
      wrap.append(labelEl, dial);
      return wrap;
    }

    function getDialValue(scope, id, fallback = 0) {
      const dial = scope.querySelector(`[data-dial-id="${id}"]`);
      if (!dial) return fallback;
      const value = Number(dial.dataset.value);
      return Number.isFinite(value) ? value : fallback;
    }

    function parseNotation(notation) {
      const src = String(notation || "").trim();
      const m = src.match(/^(\d+)([A-Za-z].*)$/);
      if (!m) return { coefficient: 1, formula: src };
      return { coefficient: Number(m[1]), formula: m[2] };
    }

    function buildFormulaAscii(tokens) {
      return tokens.map(t => `${t.symbol}${t.count > 1 ? t.count : ""}`).join("");
    }

    function getNameCardOptions(q) {
      const allNames = [...new Set(
        QUESTIONS.filter(item => item.taskType === "compound_name_valency").map(item => item.correctAnswer.name)
      )];
      const correct = q.correctAnswer.name;
      const distractors = allNames.filter(name => name !== correct);
      const seed = String(q.id || "").split("").reduce((acc, ch) => acc + ch.charCodeAt(0), 0);
      const picks = [];
      for (let i = 0; i < distractors.length && picks.length < 3; i++) {
        const idx = (seed + i * 5) % distractors.length;
        if (!picks.includes(distractors[idx])) picks.push(distractors[idx]);
      }
      const options = [correct, ...picks].slice(0, 4);
      return shuffle(options);
    }

    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function updateBestScoreBadge() {
      const best = Number(localStorage.getItem(BEST_SCORE_KEY) || 0);
      bestScoreBadge.textContent = `Najbolji rezultat: ${best}`;
    }

    function initCategorySelect() {
      const categories = [...new Set(QUESTIONS.map(q => q.category))].sort((a,b) => a.localeCompare(b, "hr"));
      categorySelect.innerHTML = `<option value="all">Sve kategorije</option>` +
        categories.map(c => `<option value="${c}">${c}</option>`).join("");
    }

    function getFilteredQuestions() {
      const selectedCategory = categorySelect.value;
      const selectedDifficulty = difficultySelect.value;

      return QUESTIONS.filter(q => {
        const catOK = selectedCategory === "all" || q.category === selectedCategory;
        const diffOK = selectedDifficulty === "all" || q.difficulty === selectedDifficulty;
        return catOK && diffOK;
      });
    }

    function startQuiz() {
      const filtered = getFilteredQuestions();
      if (filtered.length < 1) {
        alert("Nema pitanja za odabrane filtere.");
        return;
      }

      state.pool = shuffle(filtered).slice(0, Math.min(10, filtered.length));
      state.currentIndex = 0;
      state.scoreCorrect = 0;
      state.scoreWrong = 0;
      state.lastChecked = false;

      setupScreen.classList.add("hidden");
      resultScreen.classList.add("hidden");
      quizScreen.classList.remove("hidden");

      renderCurrentQuestion();
      updateScoreBadge();
    }

    function renderCurrentQuestion() {
      feedback.className = "feedback hidden";
      feedback.textContent = "";
      nextBtn.classList.add("hidden");
      state.lastChecked = false;

      const q = state.pool[state.currentIndex];
      state.currentQuestion = q;

      progressBadge.textContent = `Pitanje ${state.currentIndex + 1}/${state.pool.length}`;
      questionTitle.textContent = q.question;
      questionMeta.textContent = `${q.category} • ${q.difficulty} • tip: ${q.taskType}`;

      answerContainer.innerHTML = "";

      if (q.taskType === "equation_balance") {
        const wrapper = document.createElement("div");
        wrapper.className = "task-group";
        wrapper.innerHTML = "<p class='small muted'>Podesi koeficijente pomoću brojčanika.</p>";

        const eqRow = document.createElement("div");
        eqRow.className = "eq-row";

        q.payload.species.forEach((species, i) => {
          const dial = createNumberDial({
            id: `eq-${i}`,
            value: 1,
            min: 1,
            max: 9,
            label: `Koeficijent uz ${formulaToSubscript(species)}`
          });
          const chip = document.createElement("span");
          chip.className = "chip";
          chip.textContent = formulaToSubscript(species);
          eqRow.append(dial, chip);

          const sideNow = q.payload.sides[i];
          const sideNext = q.payload.sides[i + 1];
          if (sideNext && sideNow === sideNext) {
            const plus = document.createElement("span");
            plus.textContent = "+";
            eqRow.append(plus);
          }
          if (sideNext && sideNow !== sideNext) {
            const arrow = document.createElement("span");
            arrow.textContent = "→";
            eqRow.append(arrow);
          }
        });
        wrapper.appendChild(eqRow);
        answerContainer.appendChild(wrapper);
      }

      if (q.taskType === "compound_formula") {
        const wrapper = document.createElement("div");
        wrapper.className = "task-group";
        wrapper.innerHTML = "<p class='small muted'>Sastavi formulu pomoću brojčanika indeksa.</p>";

        const baseFormula = q.correctAnswer.formula || "";
        const tokens = parseChemicalFormula(baseFormula);
        wrapper.dataset.formulaTokens = JSON.stringify(tokens.map(t => ({ symbol: t.symbol })));
        const dialGrid = document.createElement("div");
        dialGrid.className = "dial-grid";
        tokens.forEach((token, i) => {
          dialGrid.appendChild(createNumberDial({
            id: `cf-${i}`,
            value: 1,
            min: 1,
            max: 9,
            label: `${token.symbol} indeks`
          }));
        });
        const preview = document.createElement("div");
        preview.className = "formula-preview";
        preview.id = "compoundFormulaPreview";
        const renderPreview = () => {
          const live = tokens.map((t, i) => ({ symbol: t.symbol, count: getDialValue(wrapper, `cf-${i}`, 1) }));
          preview.textContent = formulaToSubscript(buildFormulaAscii(live));
        };
        wrapper.addEventListener("dialchange", renderPreview);
        renderPreview();
        wrapper.append(dialGrid, preview);
        answerContainer.appendChild(wrapper);
      }

      if (q.taskType === "formula_notation") {
        const wrapper = document.createElement("div");
        wrapper.className = "task-group";
        const parsed = parseNotation(q.correctAnswer.notation || "");
        wrapper.dataset.notationFormula = parsed.formula;
        wrapper.innerHTML = "<p class='small muted'>Podesi broj čestica brojčanikom.</p>";

        const row = document.createElement("div");
        row.className = "eq-row";
        row.appendChild(createNumberDial({
          id: "fn-coef",
          value: 1,
          min: 1,
          max: 12,
          label: "Broj molekula/atoma"
        }));
        const chip = document.createElement("span");
        chip.className = "chip";
        chip.textContent = formulaToSubscript(parsed.formula);
        row.appendChild(chip);
        wrapper.appendChild(row);

        const preview = document.createElement("div");
        preview.className = "formula-preview";
        const renderPreview = () => {
          const coef = getDialValue(wrapper, "fn-coef", 1);
          preview.textContent = formulaToSubscript(`${coef}${parsed.formula}`);
        };
        wrapper.addEventListener("dialchange", renderPreview);
        renderPreview();
        wrapper.appendChild(preview);
        answerContainer.appendChild(wrapper);
      }

      if (q.taskType === "compound_name_valency") {
        const wrapper = document.createElement("div");
        wrapper.className = "task-group";

        const nameLabel = document.createElement("p");
        nameLabel.className = "small muted";
        nameLabel.textContent = "Odaberi točan naziv spoja:";
        wrapper.appendChild(nameLabel);

        const nameGrid = document.createElement("div");
        nameGrid.className = "option-grid";
        const cardOptions = getNameCardOptions(q);
        cardOptions.forEach(name => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "option-btn";
          btn.dataset.choiceName = name;
          btn.setAttribute("aria-pressed", "false");
          btn.textContent = name;
          btn.addEventListener("click", () => {
            nameGrid.querySelectorAll(".option-btn").forEach(b => {
              b.classList.remove("selected");
              b.setAttribute("aria-pressed", "false");
            });
            btn.classList.add("selected");
            btn.setAttribute("aria-pressed", "true");
            wrapper.dataset.selectedName = name;
          });
          nameGrid.appendChild(btn);
        });
        wrapper.appendChild(nameGrid);

        const valLabel = document.createElement("p");
        valLabel.className = "small muted";
        valLabel.style.marginTop = "12px";
        valLabel.textContent = "Odaberi valencije:";
        wrapper.appendChild(valLabel);

        const romanOptions = ["I", "II", "III", "IV", "V", "VI"];
        Object.keys(q.correctAnswer.valencies || {}).forEach(element => {
          const block = document.createElement("div");
          block.style.marginBottom = "10px";
          const label = document.createElement("div");
          label.className = "small";
          label.style.fontWeight = "700";
          label.textContent = `${element}`;
          const row = document.createElement("div");
          row.className = "segment-row";
          row.dataset.valencyFor = element;

          romanOptions.forEach(roman => {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "segment-btn";
            btn.dataset.valency = roman;
            btn.setAttribute("aria-pressed", "false");
            btn.textContent = roman;
            btn.addEventListener("click", () => {
              row.querySelectorAll(".segment-btn").forEach(b => {
                b.classList.remove("selected");
                b.setAttribute("aria-pressed", "false");
              });
              btn.classList.add("selected");
              btn.setAttribute("aria-pressed", "true");
              wrapper.dataset[`valency${element}`] = roman;
            });
            row.appendChild(btn);
          });

          block.append(label, row);
          wrapper.appendChild(block);
        });
        answerContainer.appendChild(wrapper);
      }

      if (q.taskType === "subatomic_counts") {
        const wrapper = document.createElement("div");
        wrapper.className = "task-group";
        wrapper.innerHTML = "<p class='small muted'>Podesi p⁺, e⁻ i n⁰ pomoću brojčanika.</p>";
        const dialGrid = document.createElement("div");
        dialGrid.className = "dial-grid";
        dialGrid.appendChild(createNumberDial({ id: "sa-p", value: 0, min: 0, max: 120, label: "p⁺ protoni" }));
        dialGrid.appendChild(createNumberDial({ id: "sa-e", value: 0, min: 0, max: 120, label: "e⁻ elektroni" }));
        dialGrid.appendChild(createNumberDial({ id: "sa-n", value: 0, min: 0, max: 180, label: "n⁰ neutroni" }));
        wrapper.appendChild(dialGrid);
        answerContainer.appendChild(wrapper);
      }

      if (q.taskType === "classification") {
        const wrapper = document.createElement("div");
        wrapper.className = "task-group";
        const title = document.createElement("p");
        title.className = "small muted";
        title.textContent = "Za svaku formulu klikni odgovarajuću skupinu:";
        wrapper.appendChild(title);

        const classOptions = [
          { key: "atomi_elementa", label: "Atomi kemijskog elementa" },
          { key: "molekule_elementarnih_tvari", label: "Molekule elementarnih tvari" },
          { key: "molekule_spojeva", label: "Molekule kemijskih spojeva" }
        ];
        q.payload.items.forEach(item => {
          const card = document.createElement("div");
          card.className = "class-item";
          const itemLabel = document.createElement("div");
          itemLabel.className = "chip";
          itemLabel.style.display = "inline-block";
          itemLabel.textContent = formulaToSubscript(item);
          card.appendChild(itemLabel);

          const row = document.createElement("div");
          row.className = "segment-row";
          row.style.marginTop = "10px";
          row.dataset.item = item;
          classOptions.forEach(opt => {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "segment-btn";
            btn.dataset.classChoice = opt.key;
            btn.setAttribute("aria-pressed", "false");
            btn.textContent = opt.label;
            btn.addEventListener("click", () => {
              row.querySelectorAll(".segment-btn").forEach(b => {
                b.classList.remove("selected");
                b.setAttribute("aria-pressed", "false");
              });
              btn.classList.add("selected");
              btn.setAttribute("aria-pressed", "true");
              wrapper.dataset[`class${item}`] = opt.key;
            });
            row.appendChild(btn);
          });
          card.appendChild(row);
          wrapper.appendChild(card);
        });
        answerContainer.appendChild(wrapper);
      }
    }

    function getUserAnswer(q) {
      if (q.taskType === "equation_balance") {
        const values = q.payload.species.map((_, i) => getDialValue(answerContainer, `eq-${i}`, 1));
        return { coefficients: values };
      }

      if (q.taskType === "compound_formula") {
        const wrapper = answerContainer.querySelector(".task-group");
        const tokens = JSON.parse(wrapper?.dataset.formulaTokens || "[]");
        const formula = buildFormulaAscii(tokens.map((t, i) => ({
          symbol: t.symbol,
          count: getDialValue(wrapper, `cf-${i}`, 1)
        })));
        return { formula };
      }

      if (q.taskType === "formula_notation") {
        const wrapper = answerContainer.querySelector(".task-group");
        const formula = wrapper?.dataset.notationFormula || "";
        const coef = getDialValue(wrapper || answerContainer, "fn-coef", 1);
        return { notation: `${coef}${formula}` };
      }

      if (q.taskType === "compound_name_valency") {
        const wrapper = answerContainer.querySelector(".task-group");
        const valencies = {};
        Object.keys(q.correctAnswer.valencies || {}).forEach(element => {
          valencies[element] = wrapper?.dataset[`valency${element}`] || "";
        });
        return {
          name: wrapper?.dataset.selectedName || "",
          valencies
        };
      }

      if (q.taskType === "subatomic_counts") {
        const wrapper = answerContainer.querySelector(".task-group");
        return {
          protons: getDialValue(wrapper || answerContainer, "sa-p", 0),
          electrons: getDialValue(wrapper || answerContainer, "sa-e", 0),
          neutrons: getDialValue(wrapper || answerContainer, "sa-n", 0)
        };
      }

      if (q.taskType === "classification") {
        const wrapper = answerContainer.querySelector(".task-group");
        const result = {};
        q.payload.items.forEach(item => {
          result[item] = wrapper?.dataset[`class${item}`] || "";
        });
        return { assigned: result };
      }

      return {};
    }

    function formatCorrectAnswer(q) {
      if (q.taskType === "equation_balance") {
        const parts = q.payload.species.map((s, i) => `${q.correctAnswer.coefficients[i]}${s}`);
        let out = "";
        for (let i = 0; i < parts.length; i++) {
          out += parts[i];
          const now = q.payload.sides[i];
          const next = q.payload.sides[i + 1];
          if (next) out += now === next ? " + " : " → ";
        }
        return formulaToSubscript(out);
      }
      if (q.taskType === "compound_formula") return formulaToSubscript(q.correctAnswer.formula);
      if (q.taskType === "formula_notation") return formulaToSubscript(q.correctAnswer.notation);
      if (q.taskType === "compound_name_valency") {
        const vals = Object.entries(q.correctAnswer.valencies || {})
          .map(([el, val]) => `${el}=${val}`)
          .join(", ");
        return `${q.correctAnswer.name}; ${vals}`;
      }
      if (q.taskType === "subatomic_counts") {
        return `p+=${q.correctAnswer.protons}, e-=${q.correctAnswer.electrons}, n0=${q.correctAnswer.neutrons}`;
      }
      if (q.taskType === "classification") {
        const ca = q.correctAnswer;
        return `Atomi: ${ca.atomi_elementa.map(formulaToSubscript).join(", ")} | Elementarne molekule: ${ca.molekule_elementarnih_tvari.map(formulaToSubscript).join(", ")} | Molekule spojeva: ${ca.molekule_spojeva.map(formulaToSubscript).join(", ")}`;
      }
      return "";
    }

    function validateAnswer(q, user) {
      if (q.taskType === "equation_balance") {
        if (!user.coefficients.every(n => Number.isInteger(n) && n > 0)) return false;
        return user.coefficients.length === q.correctAnswer.coefficients.length &&
          user.coefficients.every((n, i) => n === q.correctAnswer.coefficients[i]);
      }

      if (q.taskType === "compound_formula") {
        const entered = normalizeFormulaInput(user.formula);
        const valid = [q.correctAnswer.formula, ...q.acceptedAnswers.map(a => a.formula)].map(normalizeFormulaInput);
        return valid.includes(entered);
      }

      if (q.taskType === "formula_notation") {
        const entered = normalizeFormulaInput(user.notation);
        const valid = [q.correctAnswer.notation, ...q.acceptedAnswers.map(a => a.notation)].map(normalizeFormulaInput);
        return valid.includes(entered);
      }

      if (q.taskType === "compound_name_valency") {
        const enteredName = normalizeName(user.name);
        const names = [q.correctAnswer.name, ...q.acceptedAnswers.map(a => a.name)].map(normalizeName);
        const valencyOk = Object.keys(q.correctAnswer.valencies || {}).every(key => {
          const entered = String(user.valencies?.[key] || "").trim().toUpperCase();
          const expected = String(q.correctAnswer.valencies[key] || "").trim().toUpperCase();
          return entered === expected;
        });
        return names.includes(enteredName) && valencyOk;
      }

      if (q.taskType === "subatomic_counts") {
        return user.protons === q.correctAnswer.protons &&
          user.electrons === q.correctAnswer.electrons &&
          user.neutrons === q.correctAnswer.neutrons;
      }

      if (q.taskType === "classification") {
        const expected = {};
        q.correctAnswer.atomi_elementa.forEach(item => expected[item] = "atomi_elementa");
        q.correctAnswer.molekule_elementarnih_tvari.forEach(item => expected[item] = "molekule_elementarnih_tvari");
        q.correctAnswer.molekule_spojeva.forEach(item => expected[item] = "molekule_spojeva");
        return q.payload.items.every(item => user.assigned[item] === expected[item]);
      }

      return false;
    }

    function updateScoreBadge() {
      scoreBadge.textContent = `Točno: ${state.scoreCorrect} | Netočno: ${state.scoreWrong}`;
    }

    function checkCurrentAnswer() {
      if (state.lastChecked) return;

      const q = state.currentQuestion;
      const user = getUserAnswer(q);
      const correct = validateAnswer(q, user);

      state.lastChecked = true;
      if (correct) state.scoreCorrect += 1;
      else state.scoreWrong += 1;

      updateScoreBadge();

      feedback.classList.remove("hidden", "ok", "bad");
      feedback.classList.add(correct ? "ok" : "bad");
      feedback.innerHTML = `
        <strong>${correct ? "Točno!" : "Netočno."}</strong>
        <p>${q.explanation}</p>
        <p><strong>Točan odgovor:</strong> ${formatCorrectAnswer(q)}</p>
      `;

      nextBtn.classList.remove("hidden");
    }

    function nextQuestion() {
      if (!state.lastChecked) return;
      state.currentIndex += 1;

      if (state.currentIndex >= state.pool.length) {
        finishQuiz();
        return;
      }

      renderCurrentQuestion();
    }

    function finishQuiz() {
      quizScreen.classList.add("hidden");
      resultScreen.classList.remove("hidden");

      const total = state.pool.length;
      const pct = total > 0 ? Math.round((state.scoreCorrect / total) * 100) : 0;

      resultCorrect.textContent = String(state.scoreCorrect);
      resultWrong.textContent = String(state.scoreWrong);
      resultPercent.textContent = `${pct}%`;

      const oldBest = Number(localStorage.getItem(BEST_SCORE_KEY) || 0);
      if (state.scoreCorrect > oldBest) {
        localStorage.setItem(BEST_SCORE_KEY, String(state.scoreCorrect));
        resultNote.textContent = "Bravo! Ovo je tvoj novi najbolji rezultat.";
      } else {
        resultNote.textContent = "Dobar posao! Probaj ponovno za bolji rezultat.";
      }

      updateBestScoreBadge();
    }

    function restartToSetup() {
      resultScreen.classList.add("hidden");
      quizScreen.classList.add("hidden");
      setupScreen.classList.remove("hidden");
    }

    function applyTheme(theme) {
      if (theme === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
        themeToggleBtn.textContent = "☀️ Svijetli način";
      } else {
        document.documentElement.setAttribute("data-theme", "light");
        themeToggleBtn.textContent = "🌙 Tamni način";
      }
    }

    function initTheme() {
      const storedTheme = localStorage.getItem("kemijaKvizTheme");
      if (storedTheme === "dark" || storedTheme === "light") {
        applyTheme(storedTheme);
        return;
      }
      const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      applyTheme(prefersDark ? "dark" : "light");
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
      const next = current === "dark" ? "light" : "dark";
      localStorage.setItem("kemijaKvizTheme", next);
      applyTheme(next);
    }

    startBtn.addEventListener("click", startQuiz);
    checkBtn.addEventListener("click", checkCurrentAnswer);
    nextBtn.addEventListener("click", nextQuestion);
    restartBtn.addEventListener("click", restartToSetup);
    themeToggleBtn.addEventListener("click", toggleTheme);

    initCategorySelect();
    updateBestScoreBadge();
    initTheme();
  </script>
</body>
</html>
